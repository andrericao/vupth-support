name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Links, índices e ids
        run: python3 tools/conferir.py
