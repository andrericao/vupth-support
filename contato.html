<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fale com a gente · Suporte Vupth</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main class="conteudo">
  <h1>Fale com a gente</h1>
  <p id="aviso" class="ajuda" role="status"></p>
  <form id="form" novalidate>
    <p><label>Seu nome<br><input type="text" name="nome" required maxlength="100"></label></p>
    <p><label>Seu e-mail (para a resposta)<br><input name="email" type="email" required maxlength="200"></label></p>
    <p><label>Qual o seu perfil<br>
      <select name="perfil"><option value="cliente">Cliente</option><option value="profissional">Profissional</option><option value="dono">Dono</option></select></label></p>
    <p><label>Categoria<br>
      <select name="categoria"><option value="DUVIDA">Dúvida</option><option value="PROBLEMA">Problema</option><option value="PAGAMENTO">Pagamento</option><option value="SUGESTAO">Sugestão</option><option value="RECLAMACAO">Reclamação</option><option value="ELOGIO">Elogio</option><option value="FEEDBACK">Feedback sobre o app</option><option value="OUTRO">Outro</option></select></label></p>
    <p><label>Assunto<br><input type="text" name="assunto" required maxlength="120"></label></p>
    <p><label>Mensagem<br><textarea name="mensagem" required maxlength="2000" rows="6"></textarea></label></p>
    <p><button type="submit" id="enviar">Enviar</button></p>
  </form>
  <p class="ajuda"><a href="index.html">Voltar à ajuda</a></p>
</main>
<script src="contato.js"></script>
</body>
</html>
